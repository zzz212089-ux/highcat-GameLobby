<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

  <title>歡樂喵喵屋</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Google Fonts: Inter & Rock / Display Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;800;900&family=Permanent+Marker&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: #09090b;
      color: #f4f4f5;
      overflow-x: hidden;
    }

    .rock-font {
      font-family: 'Bungee', 'Noto Sans TC', cursive, sans-serif;
    }

    .marker-font {
      font-family: 'Permanent Marker', cursive;
    }

    /* Stage Amp speaker grill texture */
    .amp-grille {
      background-color: #121118;
      background-image: radial-gradient(#27272a 1px, transparent 1px), radial-gradient(#27272a 1px, #121118 1px);
      background-size: 8px 8px;
      background-position: 0 0, 4px 4px;
    }

    /* Headbanging rhythm animation for the center rocker mascot */
    @keyframes rockHeadbang {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      25% {
        transform: translateY(-5px) rotate(-2.5deg);
      }
      50% {
        transform: translateY(3px) rotate(0deg);
      }
      75% {
        transform: translateY(-4px) rotate(2.5deg);
      }
    }

    .rock-headbang {
      animation: rockHeadbang 0.65s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      transform-origin: 50% 90%;
    }

    /* Spotlight breathing glow */
    @keyframes spotlightPulse {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }

    .spotlight-glow {
      animation: spotlightPulse 3.5s ease-in-out infinite;
    }

    /* Audio Equalizer active bars */
    @keyframes eqBarDance {
      0%, 100% { height: 4px; }
      50% { height: 16px; }
    }

    .eq-bar-active:nth-child(1) { animation: eqBarDance 0.4s ease-in-out infinite 0.1s; }
    .eq-bar-active:nth-child(2) { animation: eqBarDance 0.35s ease-in-out infinite 0.25s; }
    .eq-bar-active:nth-child(3) { animation: eqBarDance 0.45s ease-in-out infinite 0.05s; }
    .eq-bar-active:nth-child(4) { animation: eqBarDance 0.38s ease-in-out infinite 0.2s; }

    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #09090b;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #dc2626;
    }
  </style>
</head>

    let games = [];

    /* Load games from localStorage while preserving user additions */
    function loadGames() {
      try {
        const stored = localStorage.getItem('happy_cat_rock_games');
        if (stored) {
          const parsed = JSON.parse(stored);
          const customGames = parsed.filter(g => !g.isDefault);

            const match = parsed.find(p => p.id === def.id);
            return match ? { ...def, ...match, url: def.url, name: def.name, tag: def.tag, desc: def.desc, trackNum: def.trackNum } : def;
          }).concat(customGames);
        } else {
          games = [...DEFAULT_GAMES];
        }
      } catch (e) {
        games = [...DEFAULT_GAMES];
      }
      renderGames();
    }

    function saveGames() {
      try {
        localStorage.setItem('happy_cat_rock_games', JSON.stringify(games));
      } catch (e) {}
    }

    /* Render game cards matching the screenshot layout */
    function renderGames() {
      const container = document.getElementById('gamesContainer');

          <!-- Lower Dark Information & Action Section -->
          <div class="p-5 bg-[#121118] flex flex-col justify-between flex-1 gap-4">

    /* Game Execution */
    function playGame(id) {
      const g = games.find(x => x.id === id);
      if (!g) return;
      currentGamePlaying = g;
      document.getElementById('playerTitle').innerText = `⚡ ${g.name}`;
      
      const iframe = document.getElementById('playerIframe');
      // Ensure clean reload
      iframe.src = 'about:blank';
      setTimeout(() => {
        iframe.src = g.url;
      }, 50);
      
      document.getElementById('playerModal').classList.remove('hidden');
      document.getElementById('playerModal').classList.add('flex');
      document.body.style.overflow = 'hidden';

      // Push history state so phone hardware/swipe back button returns to lobby
      try {
        window.history.pushState({ inGameModal: true }, '');
      } catch (e) {}
    }

    function closePlayer(popHistory = true) {
      document.getElementById('playerIframe').src = 'about:blank';
      document.getElementById('playerModal').classList.add('hidden');
      document.getElementById('playerModal').classList.remove('flex');
      document.body.style.overflow = '';
      
      if (popHistory && window.history.state && window.history.state.inGameModal) {
        window.history.back();
      }
      currentGamePlaying = null;
    }

    function refreshPlayer() {
      if (currentGamePlaying) {
        document.getElementById('playerIframe').src = currentGamePlaying.url;
      }
    }

    function openExternalTab() {
      if (currentGamePlaying) {
        window.open(currentGamePlaying.url, '_blank');
      }
    }

    function deleteGame(id, event) {
      event.stopPropagation();
      games = games.filter(g => g.id !== id);
      saveGames();
      renderGames();
    }

    /* Modal Handling */
    function openAddModal() {
      document.getElementById('addModal').classList.remove('hidden');
      document.getElementById('addModal').classList.add('flex');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.add('hidden');
      document.getElementById('addModal').classList.remove('flex');
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('inputGameName').value.trim();
      const url = document.getElementById('inputGameUrl').value.trim();
      const color = document.getElementById('inputGameColor').value;

      if (!name || !url) return;

      const newGame = {
        id: 'custom-' + Date.now(),
        name: name,
        iconClass: 'fa-solid fa-gamepad',
        url: url,
        colorTheme: color,
        desc: '使用者收錄自訂遊戲狂歡區',
        isDefault: false
      };

      games.push(newGame);
      saveGames();
      renderGames();
      closeAddModal();
      document.getElementById('inputGameName').value = '';
      document.getElementById('inputGameUrl').value = '';
    }

    /* Web Audio Engine: 142 BPM High-Octane Stadium Hard Rock Anthem (Zero-Dropout Architecture) */
    let audioCtx = null;
    let isPlaying = false;
    let schedulerTimer = null;
    let audioWorker = null;
    let currentStep = 0;
    let nextStepTime = 0;
    let distortionCurve = null;
    let sharedNoiseBuffer = null;
    let masterCompressor = null;
    let masterGain = null;

    /* Pitch Frequencies for Rock Riffing */
    const A2 = 110.00, C3 = 130.81, D3 = 146.83, E3 = 164.81, F3 = 174.61, G3 = 196.00, A3 = 220.00, B3 = 246.94;
    const C4 = 261.63, D4 = 293.66, E4 = 329.63, F4 = 349.23, G4 = 392.00, A4 = 440.00, B4 = 493.88;
    const C5 = 523.25, D5 = 587.33, E5 = 659.25, G5 = 783.99, A5 = 880.00;
    const C6 = 1046.50, D6 = 1174.66, E6 = 1318.51, G6 = 1567.98;

    /* Stadium Hard Rock Power Chords */
    const CHORD_A5 = [A2, E3, A3];
    const CHORD_C5 = [C3, G3, C4];
    const CHORD_D5 = [D3, A3, D4];
    const CHORD_F5 = [F3, C4, F4];
    const CHORD_G5 = [G3, D4, G4];
    const CHORD_E5 = [E3, B3, E4];

    /* Warm, Punchy Rock Overdrive Curve */
    function makeDistortionCurve(amount = 45) {
      const n_samples = 44100;
      const curve = new Float32Array(n_samples);
      const deg = Math.PI / 180;
      for (let i = 0; i < n_samples; ++i) {
        const x = (i * 2) / n_samples - 1;
        curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
      }
      return curve;
    }

    function initAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        distortionCurve = makeDistortionCurve(45);

        // Master Dynamics Compressor prevents overload distortion & hardware audio cutoffs
        masterCompressor = audioCtx.createDynamicsCompressor();
        masterCompressor.threshold.setValueAtTime(-14, audioCtx.currentTime);
        masterCompressor.knee.setValueAtTime(25, audioCtx.currentTime);
        masterCompressor.ratio.setValueAtTime(10, audioCtx.currentTime);
        masterCompressor.attack.setValueAtTime(0.003, audioCtx.currentTime);
        masterCompressor.release.setValueAtTime(0.12, audioCtx.currentTime);

        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0.85, audioCtx.currentTime);

        masterCompressor.connect(masterGain);
        masterGain.connect(audioCtx.destination);

        // Pre-create shared noise buffer for snare and cymbals
        const bufferSize = audioCtx.sampleRate * 1.5;
        sharedNoiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = sharedNoiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        // Initialize Background-Resistant Web Worker Ticker (immune to iframe focus throttling)
        try {
          const workerBlob = new Blob([`
            let timer = null;
            self.onmessage = function(e) {
              if (e.data === 'start') {
                if (!timer) timer = setInterval(() => self.postMessage('tick'), 35);
              } else if (e.data === 'stop') {
                if (timer) { clearInterval(timer); timer = null; }
              }
            };
          `], { type: 'application/javascript' });
          audioWorker = new Worker(URL.createObjectURL(workerBlob));
          audioWorker.onmessage = () => {
            if (isPlaying) scheduleStep();
          };
        } catch (err) {
          audioWorker = null;
        }
      }

      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    /* Punchy Hard Rock Drums (All routing through masterCompressor) */
    function playKick(time) {
      if (!audioCtx || !masterCompressor) return;
      const playTime = Math.max(time, audioCtx.currentTime);
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(135, playTime);
      osc.frequency.exponentialRampToValueAtTime(38, playTime + 0.13);
      gain.gain.setValueAtTime(1.0, playTime);
      gain.gain.exponentialRampToValueAtTime(0.001, playTime + 0.15);
      osc.connect(gain);
      gain.connect(masterCompressor);
      osc.start(playTime);
      osc.stop(playTime + 0.16);
    }

    function playSnare(time) {
      if (!audioCtx || !sharedNoiseBuffer || !masterCompressor) return;
      const playTime = Math.max(time, audioCtx.currentTime);
      const noise = audioCtx.createBufferSource();
      noise.buffer = sharedNoiseBuffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1250, playTime);
      filter.Q.setValueAtTime(0.9, playTime);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.7, playTime);
      gain.gain.exponentialRampToValueAtTime(0.001, playTime + 0.17);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(masterCompressor);
      noise.start(playTime);
      noise.stop(playTime + 0.18);

      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(200, playTime);
      osc.frequency.exponentialRampToValueAtTime(90, playTime + 0.08);
      oscGain.gain.setValueAtTime(0.5, playTime);
      oscGain.gain.exponentialRampToValueAtTime(0.001, playTime + 0.09);
      osc.connect(oscGain);
      oscGain.connect(masterCompressor);
      osc.start(playTime);
      osc.stop(playTime + 0.1);
    }

    function playHiHat(time, open = false) {
      if (!audioCtx || !sharedNoiseBuffer || !masterCompressor) return;
      const playTime = Math.max(time, audioCtx.currentTime);
      const noise = audioCtx.createBufferSource();
      noise.buffer = sharedNoiseBuffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.setValueAtTime(7500, playTime);

      const dur = open ? 0.11 : 0.04;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(open ? 0.22 : 0.13, playTime);
      gain.gain.exponentialRampToValueAtTime(0.001, playTime + dur);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(masterCompressor);
      noise.start(playTime);
      noise.stop(playTime + dur + 0.01);
    }

    function playCrash(time) {
      if (!audioCtx || !sharedNoiseBuffer || !masterCompressor) return;
      const playTime = Math.max(time, audioCtx.currentTime);
      const noise = audioCtx.createBufferSource();
      noise.buffer = sharedNoiseBuffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(4800, playTime);
      filter.Q.setValueAtTime(1.0, playTime);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.42, playTime);
      gain.gain.exponentialRampToValueAtTime(0.001, playTime + 0.85);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(masterCompressor);
      noise.start(playTime);
      noise.stop(playTime + 0.88);
    }

    /* Crunchy Hard Rock Rhythm Guitar */
    function playPowerChord(time, chordNotes, duration = 0.18, isPalmMute = false) {
      if (!audioCtx || !chordNotes || !masterCompressor) return;
      const playTime = Math.max(time, audioCtx.currentTime);
      chordNotes.forEach((freq) => {
        const osc = audioCtx.createOscillator();
        const dist = audioCtx.createWaveShaper();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, playTime);

        dist.curve = distortionCurve;
        dist.oversample = '4x';

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(isPalmMute ? 1300 : 3200, playTime);

        const vol = isPalmMute ? 0.12 : 0.17;
        gain.gain.setValueAtTime(vol, playTime);
        gain.gain.exponentialRampToValueAtTime(0.001, playTime + duration);

        osc.connect(dist);
        dist.connect(filter);
        filter.connect(gain);
        gain.connect(masterCompressor);

        osc.start(playTime);
        osc.stop(playTime + duration + 0.02);
      });
    }

    /* Melodic Pentatonic Lead Guitar */
    function playLeadNote(time, freq, duration = 0.24) {
      if (!audioCtx || !freq || !masterCompressor) return;
      const playTime = Math.max(time, audioCtx.currentTime);
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const dist = audioCtx.createWaveShaper();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      osc1.type = 'sawtooth';
      osc2.type = 'sawtooth';
      osc1.frequency.setValueAtTime(freq, playTime);
      osc2.frequency.setValueAtTime(freq * 1.006, playTime); // detuned chorus

      dist.curve = distortionCurve;
      dist.oversample = '4x';

      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(2100, playTime);
      filter.Q.setValueAtTime(2.2, playTime);

      gain.gain.setValueAtTime(0.22, playTime);
      gain.gain.exponentialRampToValueAtTime(0.001, playTime + duration);

      osc1.connect(dist);
      osc2.connect(dist);
      dist.connect(filter);
      filter.connect(gain);
      gain.connect(masterCompressor);

      osc1.start(playTime);
      osc2.start(playTime);
      osc1.stop(playTime + duration + 0.03);
      osc2.stop(playTime + duration + 0.03);
    }

    /* 64-step Driving Hard Rock Riff Pattern (142 BPM, 4 Bars) */
    const ROCK_STEPS = [
      // Bar 1: Driving A5 Classic Rock Hook
      { kick: 1, crash: 1, chord: CHORD_A5, dur: 0.32, solo: A4 },
      { hat: 1, chord: CHORD_A5, pm: 1 },
      { hat: 1, chord: CHORD_A5, pm: 1 },
      { kick: 1, hat: 1, chord: CHORD_A5, dur: 0.18, solo: C5 },
      { snare: 1, hat: 1, chord: CHORD_C5, dur: 0.22, solo: D5 },
      { hat: 1, chord: CHORD_C5, pm: 1 },
      { kick: 1, hat: 1, chord: CHORD_D5, dur: 0.28, solo: E5 },
      { hat: 1, chord: CHORD_D5, pm: 1 },

      { kick: 1, hat: 1, chord: CHORD_A5, dur: 0.26, solo: G5 },
      { hat: 1, chord: CHORD_A5, pm: 1 },
      { hat: 1, chord: CHORD_A5, pm: 1 },
      { kick: 1, hat: 1, chord: CHORD_G5, dur: 0.2, solo: E5 },
      { snare: 1, hat: 1, chord: CHORD_D5, dur: 0.24, solo: D5 },
      { hat: 1, chord: CHORD_D5, pm: 1 },
      { kick: 1, hat: 1, chord: CHORD_C5, dur: 0.22, solo: C5 },
      { hat: 1, chord: CHORD_C5, pm: 1 },

      // Bar 2: Steady Groove & Punchy Bass Turnaround
      { kick: 1, hat: 1, chord: CHORD_A5, dur: 0.32, solo: A4 },
      { hat: 1, chord: CHORD_A5, pm: 1 },
      { hat: 1, chord: CHORD_A5, pm: 1 },
      { kick: 1, hat: 1, chord: CHORD_C5, dur: 0.2, solo: E5 },
      { snare: 1, hat: 1, chord: CHORD_D5, dur: 0.24, solo: G5 },
      { hat: 1, chord: CHORD_D5, pm: 1 },
      { kick: 1, hat: 1, chord: CHORD_F5, dur: 0.26, solo: A5 },
      { hat: 1, chord: CHORD_F5, pm: 1 },

      { kick: 1, hat: 1, chord: CHORD_G5, dur: 0.28, solo: C6 },
      { hat: 1, chord: CHORD_G5, pm: 1 },
      { kick: 1, hat: 1, chord: CHORD_E5, dur: 0.24, solo: B4 },
      { hat: 1, chord: CHORD_E5, pm: 1 },
      { snare: 1, hat: 1, chord: CHORD_A5, dur: 0.32, solo: A5 },
      { kick: 1, hat: 1, chord: CHORD_A5, pm: 1 },
      { hat: 1, chord: CHORD_A5, pm: 1 },
      { hat: 1, chord: CHORD_A5, pm: 1 },

      // Bar 3: Screaming Guitar Lead & Kick Accents
      { kick: 1, crash: 1, chord: CHORD_A5, dur: 0.34, solo: E6 },
      { hat: 1, chord: CHORD_A5, pm: 1 },
      { hat: 1, chord: CHORD_A5, pm: 1 },
      { kick: 1, hat: 1, chord: CHORD_A5, dur: 0.2, solo: D6 },
      { snare: 1, hat: 1, chord: CHORD_C5, dur: 0.24, solo: C6 },
      { hat: 1, chord: CHORD_C5, pm: 1 },
      { kick: 1, hat: 1, chord: CHORD_D5, dur: 0.28, solo: A5 },
      { hat: 1, chord: CHORD_D5, pm: 1 },

      { kick: 1, hat: 1, chord: CHORD_F5, dur: 0.26, solo: G5 },
      { hat: 1, chord: CHORD_F5, pm: 1 },
      { kick: 1, hat: 1, chord: CHORD_G5, dur: 0.26, solo: A5 },
      { hat: 1, chord: CHORD_G5, pm: 1 },
      { snare: 1, hat: 1, chord: CHORD_A5, dur: 0.3, solo: C6 },
      { kick: 1, hat: 1, chord: CHORD_A5, pm: 1 },
      { hat: 1, chord: CHORD_A5, pm: 1 },
      { hat: 1, chord: CHORD_A5, pm: 1 },

      // Bar 4: Rock Drum Fill & Anthem Climax
      { kick: 1, chord: CHORD_D5, dur: 0.24, solo: D6 },
      { hat: 1, chord: CHORD_D5, pm: 1 },
      { kick: 1, chord: CHORD_E5, dur: 0.24, solo: E6 },
      { hat: 1, chord: CHORD_E5, pm: 1 },
      { snare: 1, kick: 1, chord: CHORD_A5, dur: 0.2 },
      { snare: 1, solo: E5 },
      { kick: 1, solo: G5 },
      { kick: 1, solo: A5 },

      { snare: 1, kick: 1, crash: 1, chord: CHORD_G5, dur: 0.28, solo: C6 },
      { snare: 1, solo: D6 },
      { kick: 1, solo: E6 },
      { snare: 1, solo: G6 },
      { kick: 1, crash: 1, chord: CHORD_A5, dur: 0.45, solo: A5 },
      { hat: 1 },
      { snare: 1 },
      { snare: 1, crash: 1 }
    ];

    /* Resilient audio scheduler with 0.85s lookahead buffer and background-tab immunity */
    function scheduleStep() {
      if (!audioCtx || !isPlaying) return;

      // Auto-resume if the browser suspended the audio context
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const stepDuration = 60 / (142 * 4); // ~0.1056s per 16th note at 142 BPM

      // Resilient schedule window of 0.85s protects against timer throttling when inside iframe or background
      while (nextStepTime < audioCtx.currentTime + 0.85) {
        const step = ROCK_STEPS[currentStep % ROCK_STEPS.length];

        if (step.crash) playCrash(nextStepTime);
        if (step.kick) playKick(nextStepTime);
        if (step.snare) playSnare(nextStepTime);
        if (step.hat) playHiHat(nextStepTime, !!step.open);
        if (step.chord) playPowerChord(nextStepTime, step.chord, step.dur || 0.16, !!step.pm);
        if (step.solo) playLeadNote(nextStepTime, step.solo, 0.24);

        nextStepTime += stepDuration;
        currentStep = (currentStep + 1) % ROCK_STEPS.length;
      }

      // Self-correcting catchup if frame was temporarily frozen
      if (nextStepTime < audioCtx.currentTime) {
        nextStepTime = audioCtx.currentTime + 0.05;
      }

      // Secondary backup timer in case Web Worker is unavailable
      if (isPlaying && !audioWorker) {
        clearTimeout(schedulerTimer);
        schedulerTimer = setTimeout(scheduleStep, 40);
      }
    }

    /* Start / Stop Toggle */
    function toggleRockMusic(event) {
      if (event) event.stopPropagation();
      initAudioContext();

      if (!isPlaying) {
        isPlaying = true;
        nextStepTime = audioCtx.currentTime + 0.05;
        if (audioWorker) audioWorker.postMessage('start');
        scheduleStep();
        updateMusicUI(true);
      } else {
        isPlaying = false;
        if (audioWorker) audioWorker.postMessage('stop');
        clearTimeout(schedulerTimer);
        updateMusicUI(false);
      }
    }

    function updateMusicUI(active) {
      const text = document.getElementById('musicText');
      const visualizer = document.getElementById('eqVisualizer');
      if (active) {
        text.innerText = '音樂狂歡中 ⚡';
        visualizer.innerHTML = `
          <span class="w-1 bg-red-500 rounded-full eq-bar-active"></span>
          <span class="w-1 bg-amber-400 rounded-full eq-bar-active"></span>
          <span class="w-1 bg-rose-500 rounded-full eq-bar-active"></span>
          <span class="w-1 bg-red-400 rounded-full eq-bar-active"></span>
        `;
      } else {
        text.innerText = '點擊播放音樂 ⚡';
        visualizer.innerHTML = `
          <span class="w-1 bg-zinc-500 rounded-full h-1"></span>
          <span class="w-1 bg-zinc-500 rounded-full h-2"></span>
          <span class="w-1 bg-zinc-500 rounded-full h-1"></span>
          <span class="w-1 bg-zinc-500 rounded-full h-1.5"></span>
        `;
      }
    }

    /* Page Initialization */
    window.onload = function () {
      loadGames();

      // Handle mobile swipe-back or browser back button to close game
      window.addEventListener('popstate', (e) => {
        if (currentGamePlaying) {
          closePlayer(false);
        }
      });

      // Handle ESC key to return to lobby
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && currentGamePlaying) {
          closePlayer();
        }
      });

      // Setup audio unlock on first user gesture
      const unlockAudio = () => {
        if (!audioCtx) initAudioContext();
        window.removeEventListener('pointerdown', unlockAudio);
        window.removeEventListener('keydown', unlockAudio);
        window.removeEventListener('touchstart', unlockAudio);
      };
      window.addEventListener('pointerdown', unlockAudio, { once: true });
      window.addEventListener('keydown', unlockAudio, { once: true });
      window.addEventListener('touchstart', unlockAudio, { once: true });
    };
  </script>
